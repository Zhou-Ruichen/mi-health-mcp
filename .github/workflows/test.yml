name: Test

on:
  pull_request:
    paths: ['src/**', 'test/**', 'wrangler.toml', 'package.json', 'package-lock.json']
  push:
    branches-ignore: [main]
    paths: ['src/**', 'test/**', 'wrangler.toml', 'package.json', 'package-lock.json']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: node --test
